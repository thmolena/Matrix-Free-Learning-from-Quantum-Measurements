[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctpcpinn"
version = "1.0.0"
description = "CPTP-Compiler-PINNs: structure-preserving residual learning and matrix-free compilation for open quantum dynamics. Reproduces every table and figure of the manuscript."
readme = "REPRODUCE.txt"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Molena Huynh" }]
keywords = ["quantum", "open-quantum-systems", "lindblad", "physics-informed-neural-networks", "PINN", "reproducibility"]

# Broad floors so the package installs widely. For BIT-IDENTICAL reproduction of
# the manuscript numbers, install the exact pinned versions instead:
#     pip install ".[exact]"
# (these are the versions the committed tables/figures were produced with).
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Exact versions used to generate the committed tables/figures (conda env 'qaoa').
exact = [
    "numpy==2.4.2",
    "scipy==1.17.1",
    "torch==2.10.0",
    "matplotlib==3.10.8",
]
dev = ["pytest>=7.0"]

[project.scripts]
ctpcpinn-reproduce = "ctpcpinn.reproduce:main"
ctpcpinn-validate = "ctpcpinn.validate:main"

[project.urls]
Repository = "https://github.com/thmolena/QuantumPINNs-Physics-Informed-Neural-Networks-for-Quantum-Relevant-Physical-Modeling"

[tool.setuptools.packages.find]
include = ["ctpcpinn*"]
