[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specops-cptppinn"
version = "3.0.0"
description = "Matrix-free spectral-frame recovery with a Bohr-anchored Sobolev loss on checksum-traceable experimental Ramsey data."
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Molena Huynh", email = "molena.huynh@jmp.com" }]
maintainers = [{ name = "Molena Huynh", email = "molena.huynh@jmp.com" }]
keywords = [
    "quantum",
    "open-quantum-systems",
    "lindblad",
    "gksl",
    "physics-informed-neural-networks",
    "PINN",
    "structure-preserving",
    "spectral-truncation",
    "operator-systems",
    "interaction-picture",
    "sobolev-regularization",
    "reproducibility",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

# Lower-bound floors keep the package broadly installable across recent
# scientific-Python environments. For bit-identical reproduction of the
# committed table and figure values, install the pinned ``exact`` group below
# and run single-threaded as documented in README.md.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.0",
    "matplotlib>=3.7",
    "cycler>=0.11",
]

[project.optional-dependencies]
# Exact versions used to generate the committed tables and figures.
exact = [
    "numpy==2.4.2",
    "scipy==1.17.1",
    "torch==2.10.0",
    "matplotlib==3.10.8",
]
dev = ["pytest>=7.0", "build>=1.0"]

[project.scripts]
cptppinn-reproduce = "ctpcpinn.reproduce:main"
ctpcpinn-reproduce = "ctpcpinn.reproduce:main"
cptppinn-validate = "ctpcpinn.validate:main"
ctpcpinn-validate = "ctpcpinn.validate:main"
cptppinn-real-data = "ctpcpinn.real_data:main"
cptppinn-fetch-real-data = "ctpcpinn.fetch_real_data:main"
ramsey-adaptive-study = "ctpcpinn.adaptive_ramsey:main"
ramsey-adaptive-figures = "ctpcpinn.adaptive_figures:main"

[project.urls]
Repository = "https://github.com/thmolena/QuantumPINNs-Physics-Informed-Neural-Networks-for-Quantum-Relevant-Physical-Modeling"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ctpcpinn*"]

[tool.setuptools.package-data]
ctpcpinn = ["data/*.csv", "data/*.json", "data/*.md"]
